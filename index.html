<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avisador Híbrido Cataluña + ESP32</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 10%, #1a1e24 0%, #0a0b0d 100%);
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px 14px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 2px;
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 0 8px rgba(255, 59, 48, 0.7));
    }
    .header-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.1;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      color: #ffffff;
      text-transform: uppercase;
    }
    h1 span { color: #ff3b30; }
    .subhead {
      font-size: 0.65rem;
      color: #00e676;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .main-content {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      justify-content: center;
      margin: 4px 0;
    }
    .alert-card {
      display: none;
      background: linear-gradient(145deg, #241111, #150a0a);
      border: 2px solid #ff3b30;
      border-radius: 14px;
      padding: 8px 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 59, 48, 0.5);
    }
    .alert-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .traffic-sign {
      width: 58px;
      height: 58px;
      background-color: #ffffff;
      border: 6px solid #d32f2f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .traffic-sign span {
      color: #000000;
      font-size: 1.5rem;
      font-weight: 900;
      font-family: Arial, sans-serif;
    }
    .radar-icon-box { font-size: 2.2rem; line-height: 1; }
    .radar-info-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .radar-info-dist {
      font-size: 1.25rem;
      color: #00e676;
      font-weight: 800;
    }
    .panel {
      background: rgba(22, 25, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 14px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .metric-group {
      display: flex;
      justify-content: space-around;
      margin-bottom: 6px;
    }
    .metric { display: flex; flex-direction: column; }
    .metric .val {
      font-size: 2rem;
      font-weight: 800;
      color: #00e676;
      line-height: 1.1;
    }
    .metric .lbl {
      font-size: 0.65rem;
      color: #8c9ba5;
      text-transform: uppercase;
    }
    .status-row {
      font-size: 0.72rem;
      color: #8c9ba5;
      margin: 2px 0;
      display: flex;
      justify-content: space-between;
    }
    .log-box {
      background: #08090b;
      border: 1px solid #1c2229;
      border-radius: 8px;
      height: 55px;
      padding: 4px 6px;
      font-size: 0.65rem;
      color: #9ab0c2;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
      margin-top: 6px;
    }
    .btn-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-action {
      background: linear-gradient(135deg, #ff3b30 0%, #d32f2f 100%);
      color: #fff;
      border: none;
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-action.active {
      background: linear-gradient(135deg, #2b3038 0%, #1e2227 100%);
      color: #8c9ba5;
    }
    .btn-ble {
      background: linear-gradient(135deg, #007aff 0%, #0051ba 100%);
      color: #fff;
      border: none;
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-ble.connected {
      background: #00e676;
      color: #000;
    }
  </style>
</head>
<body>

  <header>
    <svg class="brand-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" stroke="#ff3b30" stroke-width="4" stroke-opacity="0.4"/>
      <circle cx="50" cy="50" r="18" stroke="#ff3b30" stroke-width="3"/>
      <circle cx="50" cy="50" r="7" fill="#ff3b30"/>
    </svg>
    <div class="header-text">
      <h1>AVISADOR <span>RADARES</span></h1>
      <div class="subhead">OpenData Gencat + Waze + Display</div>
    </div>
  </header>

  <div class="main-content">
    <div class="alert-card" id="radarAlertCard">
      <div class="alert-top">
        <div class="radar-icon-box" id="alertIcon">📷</div>
        <div class="traffic-sign">
          <span id="alertSpeedSign">--</span>
        </div>
      </div>
      <div class="radar-info-title" id="alertTypeTitle">RADAR</div>
      <div class="radar-info-dist" id="alertDistance">A -- METROS</div>
    </div>

    <div class="panel">
      <div class="metric-group">
        <div class="metric">
          <span class="val" id="speedDisplay">0</span>
          <span class="lbl">km/h</span>
        </div>
        <div class="metric">
          <span class="val" id="roadLimitDisplay">--</span>
          <span class="lbl">Límite Vía</span>
        </div>
        <div class="metric">
          <span class="val" id="headingDisplay">--</span>
          <span class="lbl">Rumbo (°)</span>
        </div>
      </div>
      
      <div class="status-row">
        <span>Pantalla ESP32:</span>
        <span id="bleStatus" style="color: #ff9100; font-weight: 600;">Desconectada</span>
      </div>
      <div class="status-row">
        <span>Estado GPS:</span>
        <span id="gpsStatus" style="color: #ff9100; font-weight: 600;">En espera</span>
      </div>
      <div class="status-row">
        <span>Capa Fija (Gencat):</span>
        <span id="dbStatus" style="color: #ff9100; font-weight: 600;">Descargando...</span>
      </div>
      <div class="status-row">
        <span>Capa Dinámica (Waze):</span>
        <span id="wazeStatus" style="color: #8c9ba5; font-weight: 600;">Inactiva</span>
      </div>

      <div class="log-box" id="logBox">> Inicializando sistema...</div>
    </div>
  </div>

  <div class="btn-container">
    <button class="btn-ble" id="bleBtn" onclick="conectarPantallaBLE()">CONECTAR DISPLAY</button>
    <button class="btn-action" id="mainBtn" onclick="toggleSistema()">ACTIVAR GPS</button>
  </div>

  <script>
    const URL_PROXY_WAZE = "https://waze-radar-proxy.maestrobcn365.workers.dev";
    
    // URL con proxy CORS integrado para evitar el bloqueo en GitHub Pages
    const URL_GENCAT_SCT = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://analisi.transparenciacatalunya.cat/resource/53v5-ghkg.json?$limit=3000");

    // Respaldo urbano prioritario (puntos clave de acceso a Barcelona)
    const baseUrbanaFija = [
      {"id":"BCN-C31-TR-INI","tipo":"tramo","icone":"⏱️","velMax":80,"lat":41.4415,"lon":2.2312,"rumbo":225,"distanciaAviso":650},
      {"id":"BCN-C31-TR-FIN","tipo":"tramo","icone":"⏱️","velMax":80,"lat":41.4230,"lon":2.2110,"rumbo":225,"distanciaAviso":650},
      {"id":"BCN-GV-NORD-01","tipo":"fijo","icone":"📷","velMax":60,"lat":41.4148,"lon":2.2025,"rumbo":220,"distanciaAviso":500},
      {"id":"BCN-GLOR-TUNEL","tipo":"tramo","icone":"⏱️","velMax":50,"lat":41.4072,"lon":2.1935,"rumbo":225,"distanciaAviso":450},
      {"id":"BCN-B20-01","tipo":"fijo","icone":"📷","velMax":60,"lat":41.4398,"lon":2.1985,"rumbo":135,"distanciaAviso":450},
      {"id":"BCN-B20-02","tipo":"fijo","icone":"📷","velMax":60,"lat":41.4112,"lon":2.1450,"rumbo":220,"distanciaAviso":450},
      {"id":"BCN-B10-01","tipo":"fijo","icone":"📷","velMax":80,"lat":41.3980,"lon":2.2030,"rumbo":40,"distanciaAviso":450},
      {"id":"BCN-B10-02","tipo":"fijo","icone":"📷","velMax":80,"lat":41.4250,"lon":2.2215,"rumbo":220,"distanciaAviso":450}
    ];

    let baseRadaresGencat = [];
    let radaresWazeActivos = [];
    let watchId = null;
    let wakeLock = null;
    let audioContext = null;
    let silentNode = null;
    const avisosPorVoz = {};

    let limiteViaActual = 0;
    let ultimaConsultaVia = 0;
    let ultimaConsultaWaze = 0;
    let bleCharacteristic = null;

    function log(msg) {
      const box = document.getElementById("logBox");
      box.innerHTML += `<br>> ${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    function locucion(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = 'es-ES';
        voz.rate = 1.1;
        window.speechSynthesis.speak(voz);
      }
    }

    // --- CARGA DE LA BASE OFICIAL (GENCAT VÍA PROXY CORS) ---
    async function cargarBaseOficialGencat() {
      try {
        log("Conectando con Dades Obertes Gencat...");
        const res = await fetch(URL_GENCAT_SCT);
        if (res.ok) {
          const data = await res.json();
          baseRadaresGencat = data.map((item, idx) => {
            const lat = parseFloat(item.latitud || (item.geocoded_column && item.geocoded_column.latitude));
            const lon = parseFloat(item.longitud || (item.geocoded_column && item.geocoded_column.longitude));
            const vel = parseInt(item.limit_velocitat, 10) || 80;
            const esTramo = (item.tipus_cinemometre || "").toLowerCase().includes("tram");

            return {
              id: item.codi_cinemometre || `SCT-${idx}`,
              tipo: esTramo ? "tramo" : "fijo",
              icone: esTramo ? "⏱️" : "📷",
              velMax: vel,
              lat: lat,
              lon: lon,
              rumbo: null,
              distanciaAviso: vel >= 100 ? 650 : 450
            };
          }).filter(r => !isNaN(r.lat) && !isNaN(r.lon));

          const total = baseRadaresGencat.length + baseUrbanaFija.length;
          document.getElementById("dbStatus").innerText = `${total} radares (Gencat)`;
          document.getElementById("dbStatus").style.color = "#00e676";
          log(`Gencat: ${baseRadaresGencat.length} radares oficiales cargados.`);
        } else {
          throw new Error("HTTP " + res.status);
        }
      } catch (e) {
        log("Fallo Gencat: usando respaldo local.");
        document.getElementById("dbStatus").innerText = `${baseUrbanaFija.length} radares (Respaldo)`;
        document.getElementById("dbStatus").style.color = "#ff9100";
      }
    }

    // --- CONEXIÓN BLUETOOTH LE (ESP32) ---
    async function conectarPantallaBLE() {
      try {
        log("Buscando pantalla BLE...");
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Radar_Display_128' }],
          optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
        });

        device.addEventListener('gattserverdisconnected', () => {
          document.getElementById("bleStatus").innerText = "Desconectada";
          document.getElementById("bleStatus").style.color = "#ff9100";
          document.getElementById("bleBtn").innerText = "CONECTAR DISPLAY";
          document.getElementById("bleBtn").classList.remove("connected");
          bleCharacteristic = null;
          log("Display BLE desconectado.");
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
        bleCharacteristic = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');

        document.getElementById("bleStatus").innerText = "Conectada";
        document.getElementById("bleStatus").style.color = "#00e676";
        document.getElementById("bleBtn").innerText = "DISPLAY CONECTADO";
        document.getElementById("bleBtn").classList.add("connected");
        log("Display conectado por BLE.");
      } catch (error) {
        log("Error BLE: " + error.message);
      }
    }

    function enviarDatosAPantalla(velocidad, radar, distancia, limiteVia) {
      if (!bleCharacteristic) return;
      let payload = `SPD:${velocidad}|ROAD:${limiteVia}|`;
      if (radar) {
        payload += `RADAR:${radar.velMax}:${Math.round(distancia)}`;
      } else {
        payload += `CLEAR`;
      }
      const encoder = new TextEncoder();
      bleCharacteristic.writeValue(encoder.encode(payload)).catch(()=>{});
    }

    // --- CAPA WAZE DINÁMICA ---
    async function consultarWazeDinamico(lat, lon, forzar = false) {
      if (!URL_PROXY_WAZE) return;
      const ahora = Date.now();
      if (!forzar && (ahora - ultimaConsultaWaze < 45000)) return;
      ultimaConsultaWaze = ahora;

      try {
        const res = await fetch(`${URL_PROXY_WAZE}?lat=${lat}&lon=${lon}`);
        if (res.ok) {
          const alertas = await res.json();
          if (Array.isArray(alertas)) {
            radaresWazeActivos = alertas.map(a => ({
              ...a,
              tipo: a.tipo || "móvil",
              icone: "🚗",
              distanciaAviso: 650
            }));
            document.getElementById("wazeStatus").innerText = `${radaresWazeActivos.length} móviles cerca`;
            document.getElementById("wazeStatus").style.color = "#00e676";
          }
        }
      } catch (e) {
        document.getElementById("wazeStatus").innerText = "Sin respuesta";
        document.getElementById("wazeStatus").style.color = "#ff9100";
      }
    }

    // --- LÍMITE DE LA VÍA (OPENSTREETMAP / OVERPASS) ---
    async function consultarLimiteViaOSM(lat, lon) {
      const ahora = Date.now();
      if (ahora - ultimaConsultaVia < 15000) return;
      ultimaConsultaVia = ahora;

      const query = `[out:json];way(around:35,${lat},${lon})[maxspeed];out tags;`;
      const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

      try {
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data.elements && data.elements.length > 0) {
            const rawSpeed = data.elements[0].tags.maxspeed;
            const parsed = parseInt(rawSpeed, 10);
            if (!isNaN(parsed)) {
              limiteViaActual = parsed;
              document.getElementById("roadLimitDisplay").innerText = limiteViaActual;
            }
          }
        }
      } catch (e) {}
    }

    function activarAudioSegundoPlano() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
        const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
        silentNode = audioContext.createBufferSource();
        silentNode.buffer = buffer;
        silentNode.loop = true;
        silentNode.connect(audioContext.destination);
        silentNode.start();

        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: "Avisador Híbrido Activo",
            artist: "Cataluña Oficial + Waze",
            album: "Cataluña Pro"
          });
          navigator.mediaSession.playbackState = "playing";
        }
      } catch (e) {}
    }

    function desactivarAudioSegundoPlano() {
      if (silentNode) {
        try { silentNode.stop(); } catch(e){}
        silentNode = null;
      }
      if (audioContext) {
        try { audioContext.close(); } catch(e){}
        audioContext = null;
      }
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = "none";
      }
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function coincideSentido(rumboMoto, rumboRadar) {
      if (rumboRadar === null || rumboRadar === undefined || rumboMoto === null || isNaN(rumboMoto)) {
        return true;
      }
      let diff = Math.abs(rumboMoto - rumboRadar) % 360;
      if (diff > 180) diff = 360 - diff;
      return diff <= 65;
    }

    function mostrarAlertaVisual(radar, distancia) {
      const card = document.getElementById("radarAlertCard");
      document.getElementById("alertIcon").innerText = radar.icone || "📷";
      document.getElementById("alertSpeedSign").innerText = typeof radar.velMax === 'number' ? radar.velMax : "!";
      document.getElementById("alertTypeTitle").innerText = `RADAR ${radar.tipo.toUpperCase()}`;
      document.getElementById("alertDistance").innerText = `A ${Math.round(distancia)} METROS`;
      card.style.display = "block";
    }

    function ocultarAlertaVisual() {
      document.getElementById("radarAlertCard").style.display = "none";
    }

    function gestionarVozEscalonada(radar, dist) {
      if (!avisosPorVoz[radar.id]) {
        avisosPorVoz[radar.id] = { fase600: false, fase250: false, faseFin: false };
      }
      const estado = avisosPorVoz[radar.id];
      const limiteTexto = typeof radar.velMax === 'number' ? `límite ${radar.velMax}` : 'precaución';

      if (dist <= 620 && dist > 300 && !estado.fase600) {
        estado.fase600 = true;
        locucion(`Atención, ${radar.tipo} a seiscientos metros, ${limiteTexto}`);
      } else if (dist <= 260 && dist > 90 && !estado.fase250) {
        estado.fase250 = true;
        locucion(`A doscientos cincuenta metros`);
      } else if (dist <= 50 && !estado.faseFin) {
        estado.faseFin = true;
        locucion(`Punto de control`);
      }
    }

    function procesarGPS(pos) {
      document.getElementById("gpsStatus").innerText = "Activo";
      document.getElementById("gpsStatus").style.color = "#00e676";

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const vel = pos.coords.speed !== null ? Math.round(pos.coords.speed * 3.6) : 0;
      const rumbo = pos.coords.heading !== null && !isNaN(pos.coords.heading) ? Math.round(pos.coords.heading) : null;

      document.getElementById("speedDisplay").innerText = vel;
      document.getElementById("headingDisplay").innerText = rumbo !== null ? rumbo : "--";

      consultarWazeDinamico(lat, lon);
      consultarLimiteViaOSM(lat, lon);

      let radarActivo = null;
      let distanciaMinima = Infinity;

      const todosLosRadares = [...baseRadaresGencat, ...baseUrbanaFija, ...radaresWazeActivos];

      todosLosRadares.forEach(radar => {
        const dist = calcularDistancia(lat, lon, radar.lat, radar.lon);
        const radioAviso = radar.distanciaAviso || 500;

        if (dist <= radioAviso) {
          if (coincideSentido(rumbo, radar.rumbo)) {
            if (dist < distanciaMinima) {
              distanciaMinima = dist;
              radarActivo = radar;
            }
            gestionarVozEscalonada(radar, dist);
          }
        } else if (dist > radioAviso * 1.5) {
          if (avisosPorVoz[radar.id]) delete avisosPorVoz[radar.id];
        }
      });

      if (radarActivo) {
        mostrarAlertaVisual(radarActivo, distanciaMinima);
      } else {
        ocultarAlertaVisual();
      }

      enviarDatosAPantalla(vel, radarActivo, distanciaMinima, limiteViaActual);
    }

    function toggleSistema() {
      const btn = document.getElementById("mainBtn");

      if (watchId === null) {
        activarAudioSegundoPlano();
        locucion("Avisador de radares activado.");
        
        if ('wakeLock' in navigator) {
          navigator.wakeLock.request('screen').catch(()=>{});
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            consultarWazeDinamico(pos.coords.latitude, pos.coords.longitude, true);
            consultarLimiteViaOSM(pos.coords.latitude, pos.coords.longitude);
          },
          (err) => { log("GPS inicial: " + err.message); },
          { enableHighAccuracy: true, timeout: 7000 }
        );

        watchId = navigator.geolocation.watchPosition(
          procesarGPS,
          (err) => { log("Error GPS: " + err.message); },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );

        btn.innerText = "DETENER GPS";
        btn.classList.add("active");
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        desactivarAudioSegundoPlano();
        ocultarAlertaVisual();
        document.getElementById("gpsStatus").innerText = "Detenido";
        document.getElementById("gpsStatus").style.color = "#ff9100";
        document.getElementById("speedDisplay").innerText = "0";
        document.getElementById("headingDisplay").innerText = "--";
        btn.innerText = "ACTIVAR GPS";
        btn.classList.remove("active");
        locucion("Avisador detenido.");
        enviarDatosAPantalla(0, null, 0, 0);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      cargarBaseOficialGencat();
    });
  </script>
</body>
</html>
