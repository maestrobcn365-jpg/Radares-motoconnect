<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Radar Moto BT - Auto Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 16px;
    }
    header { text-align: center; margin-top: 5px; }
    h1 { font-size: 1.3rem; color: #ff3b30; letter-spacing: 1px; }

    /* TARJETA DINÁMICA DE ALERTA */
    .alert-card {
      display: none;
      width: 100%;
      max-width: 380px;
      background: #1f1212;
      border: 3px solid #ff3b30;
      border-radius: 18px;
      padding: 16px;
      margin: 10px 0;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 59, 48, 0.5);
      animation: pulsoAlerta 1.2s infinite alternate;
    }
    @keyframes pulsoAlerta {
      from { border-color: #ff3b30; transform: scale(1); }
      to { border-color: #ffffff; transform: scale(1.02); }
    }

    .alert-top {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 10px;
    }

    /* SEÑAL DE TRÁFICO REDONDA OFICIAL */
    .traffic-sign {
      width: 82px;
      height: 82px;
      background-color: #ffffff;
      border: 9px solid #d32f2f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .traffic-sign span {
      color: #000000;
      font-size: 2.1rem;
      font-weight: 900;
      font-family: Arial, Helvetica, sans-serif;
    }

    .radar-icon-box { font-size: 3.2rem; }
    .radar-info-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .radar-info-dist {
      font-size: 1.8rem;
      color: #00e676;
      font-weight: 800;
      margin-top: 4px;
    }

    /* PANEL PRINCIPAL */
    .panel {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 16px;
      text-align: center;
    }
    .metric-group {
      display: flex;
      justify-content: space-around;
      margin: 10px 0;
    }
    .metric { display: flex; flex-direction: column; }
    .metric .val { font-size: 2.4rem; font-weight: 700; color: #00e676; }
    .metric .lbl { font-size: 0.75rem; color: #aaa; text-transform: uppercase; }

    .status-row {
      font-size: 0.8rem;
      color: #888;
      margin: 4px 0;
      display: flex;
      justify-content: space-between;
    }
    .log-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      height: 75px;
      padding: 8px;
      font-size: 0.75rem;
      color: #bbb;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
      margin-top: 8px;
    }

    .btn-action {
      background: #ff3b30;
      color: #fff;
      border: none;
      width: 100%;
      max-width: 380px;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-action.active { background: #333; color: #888; }
  </style>
</head>
<body>

  <header>
    <h1>RADAR MOTO BT</h1>
    <span style="font-size: 0.8rem; color: #888;">Audio BT: X10 / CAR-KIT</span>
  </header>

  <!-- RECUADRO DE ALERTA VISUAL -->
  <div class="alert-card" id="radarAlertCard">
    <div class="alert-top">
      <div class="radar-icon-box" id="alertIcon">📷</div>
      <div class="traffic-sign">
        <span id="alertSpeedSign">--</span>
      </div>
    </div>
    <div class="radar-info-title" id="alertTypeTitle">RADAR</div>
    <div class="radar-info-dist" id="alertDistance">A -- METROS</div>
  </div>

  <!-- PANEL DE INSTRUMENTOS -->
  <div class="panel">
    <div class="metric-group">
      <div class="metric">
        <span class="val" id="speedDisplay">0</span>
        <span class="lbl">km/h</span>
      </div>
      <div class="metric">
        <span class="val" id="headingDisplay">--</span>
        <span class="lbl">Rumbo (°)</span>
      </div>
    </div>
    
    <div class="status-row">
      <span>Estado GPS:</span>
      <span id="gpsStatus" style="color: #ff9100;">En espera</span>
    </div>
    <div class="status-row">
      <span>Base de Radares:</span>
      <span id="dbStatus" style="color: #00e676;">Inicializando...</span>
    </div>

    <div class="log-box" id="logBox">> Comprobando actualizaciones oficiales...</div>
  </div>

  <button class="btn-action" id="mainBtn" onclick="toggleSistema()">ACTIVAR SISTEMA</button>

  <script>
    // 1. BASE BASE LOCAL (Disponible siempre offline)
    const baseLocalPrecargada = [

      {"id":"BCN-RL-01","tipo":"fijo","icone":"📷","velMax":80,"lat":41.3980,"lon":2.2030,"rumbo":40,"distanciaAviso":350},
      {"id":"BCN-RL-02","tipo":"fijo","icone":"📷","velMax":80,"lat":41.4250,"lon":2.2215,"rumbo":220,"distanciaAviso":350},

      {"id":"BCN-SEM-DIAG","tipo":"semáforo","icone":"🚦","velMax":50,"lat":41.3880,"lon":2.1290,"rumbo":70,"distanciaAviso":200},
      {"id":"BCN-SEM-GRAN","tipo":"semáforo","icone":"🚦","velMax":50,"lat":41.4050,"lon":2.1890,"rumbo":45,"distanciaAviso":200},
      {"id":"BDN-SEM-MAR","tipo":"semáforo","icone":"🚦","velMax":50,"lat":41.4450,"lon":2.2380,"rumbo":130,"distanciaAviso":200},

      {"id":"BDN-C31-02","tipo":"fijo","icone":"📷","velMax":80,"lat":41.4420,"lon":2.2310,"rumbo":225,"distanciaAviso":350},
      {"id":"B20-TR-INI","tipo":"tramo","icone":"⏱️","velMax":80,"lat":41.4610,"lon":2.2230,"rumbo":215,"distanciaAviso":400},
      {"id":"B20-TR-FIN","tipo":"tramo","icone":"⏱️","velMax":80,"lat":41.4430,"lon":2.1950,"rumbo":215,"distanciaAviso":400},
      {"id":"C58-MONT-01","tipo":"fijo","icone":"📷","velMax":90,"lat":41.4920,"lon":2.1680,"rumbo":330,"distanciaAviso":400},
      {"id":"C58-SAB-02","tipo":"fijo","icone":"📷","velMax":100,"lat":41.5310,"lon":2.1150,"rumbo":150,"distanciaAviso":400},
      {"id":"C16-VALLV-01","tipo":"fijo","icone":"📷","velMax":80,"lat":41.4150,"lon":2.0980,"rumbo":310,"distanciaAviso":350},
      {"id":"C16-TERR-02","tipo":"fijo","icone":"📷","velMax":90,"lat":41.5620,"lon":2.0150,"rumbo":18,"distanciaAviso":400},
      {"id":"C32-SIT-TR1","tipo":"tramo","icone":"⏱️","velMax":90,"lat":41.2480,"lon":1.8420,"rumbo":240,"distanciaAviso":400},
      {"id":"C32-CAST-01","tipo":"fijo","icone":"📷","velMax":100,"lat":41.2720,"lon":1.9920,"rumbo":65,"distanciaAviso":400},
      {"id":"C32-MAT-01","tipo":"fijo","icone":"📷","velMax":100,"lat":41.5450,"lon":2.4280,"rumbo":50,"distanciaAviso":400},
      {"id":"C31-AERO-01","tipo":"fijo","icone":"📷","velMax":80,"lat":41.3120,"lon":2.0650,"rumbo":235,"distanciaAviso":350},
      {"id":"C31-GAV-02","tipo":"fijo","icone":"📷","velMax":80,"lat":41.2850,"lon":2.0150,"rumbo":55,"distanciaAviso":350},
      {"id":"A2-CORB-01","tipo":"fijo","icone":"📷","velMax":100,"lat":41.4380,"lon":1.9720,"rumbo":290,"distanciaAviso":400},
      {"id":"A2-MART-02","tipo":"fijo","icone":"📷","velMax":100,"lat":41.4810,"lon":1.9180,"rumbo":110,"distanciaAviso":400},
      {"id":"A2-ABR-03","tipo":"fijo","icone":"📷","velMax":100,"lat":41.5180,"lon":1.8950,"rumbo":295,"distanciaAviso":400},

      {"id":"A2-BRUC-01","tipo":"fijo","icone":"📷","velMax":100,"lat":41.5830,"lon":1.7780,"rumbo":260,"distanciaAviso":400},
      {"id":"A2-IGUA-01","tipo":"fijo","icone":"📷","velMax":100,"lat":41.5920,"lon":1.6520,"rumbo":90,"distanciaAviso":400},
      {"id":"C55-MONTS-01","tipo":"fijo","icone":"📷","velMax":90,"lat":41.6110,"lon":1.8620,"rumbo":345,"distanciaAviso":400},
      {"id":"C55-COLL-MOV","tipo":"móvil habitual","icone":"🚗","velMax":90,"lat":41.5820,"lon":1.8750,"rumbo":165,"distanciaAviso":450},
      {"id":"B224-PIERA-MOV","tipo":"móvil habitual","icone":"🚗","velMax":60,"lat":41.5215,"lon":1.7580,"rumbo":85,"distanciaAviso":350},
      {"id":"B224-MASQ-MOV","tipo":"móvil habitual","icone":"🚗","velMax":90,"lat":41.4980,"lon":1.8150,"rumbo":270,"distanciaAviso":400},
      {"id":"AP7-SANTC-01","tipo":"fijo","icone":"📷","velMax":120,"lat":41.4880,"lon":2.0520,"rumbo":225,"distanciaAviso":500},
      {"id":"AP7-MOLLET-02","tipo":"fijo","icone":"📷","velMax":120,"lat":41.5380,"lon":2.2080,"rumbo":45,"distanciaAviso":500},
      {"id":"AP7-GELIDA-03","tipo":"fijo","icone":"📷","velMax":120,"lat":41.4410,"lon":1.8820,"rumbo":230,"distanciaAviso":500},
      {"id":"C17-PARETS-01","tipo":"fijo","icone":"📷","velMax":80,"lat":41.5620,"lon":2.2350,"rumbo":15,"distanciaAviso":400},
      {"id":"C17-VIC-02","tipo":"fijo","icone":"📷","velMax":100,"lat":41.9120,"lon":2.2480,"rumbo":195,"distanciaAviso":450},
      {"id":"N340-VALLIR-01","tipo":"fijo","icone":"📷","velMax":60,"lat":41.3850,"lon":1.9520,"rumbo":260,"distanciaAviso":350},
      {"id":"N340-VILLAF-02","tipo":"fijo","icone":"📷","velMax":80,"lat":41.3390,"lon":1.7120,"rumbo":80,"distanciaAviso":400}
    ];

    let baseRadares = [];
    let watchId = null;
    let wakeLock = null;
    const avisosPorVoz = {};
    const TOLERANCIA_RUMBO = 45;

    function log(msg) {
      const box = document.getElementById("logBox");
      box.innerHTML += `<br>> ${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    function locucion(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = 'es-ES';
        voz.rate = 1.1;
        window.speechSynthesis.speak(voz);
      }
    }

    // 2. MOTOR DE ACTUALIZACIÓN AUTOMÁTICA OFFLINE/ONLINE
    async function sincronizarBaseRadares() {
      // Paso A: Cargar lo guardado previamente en el móvil
      const memoria = localStorage.getItem("radares_moto_cache");
      if (memoria) {
        try {
          baseRadares = JSON.parse(memoria);
          document.getElementById("dbStatus").innerText = `${baseRadares.length} radares (memoria)`;
        } catch(e) {}
      }

      if (!baseRadares || baseRadares.length === 0) {
        baseRadares = [...baseLocalPrecargada];
        document.getElementById("dbStatus").innerText = `${baseRadares.length} radares (base)`;
      }

      // Paso B: Comprobar fuentes remotas y actualizar automáticamente
      try {
        log("Buscando actualización remota...");
        // Consulta directa al repositorio en segundo plano sin bloquear
        const res = await fetch("radares.json?nocache=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const remotos = await res.json();
          if (Array.isArray(remotos) && remotos.length > 0) {
            baseRadares = remotos;
            localStorage.setItem("radares_moto_cache", JSON.stringify(remotos));
            document.getElementById("dbStatus").innerText = `${baseRadares.length} radares (al día)`;
            log(`Base actualizada con éxito: ${baseRadares.length} radares.`);
            return;
          }
        }
      } catch (err) {
        // Sin cobertura o sin archivo remoto: usa el almacenamiento local sin fallar
      }

      // Si no hay archivo remoto, guardamos la base amplia local
      localStorage.setItem("radares_moto_cache", JSON.stringify(baseRadares));
      document.getElementById("dbStatus").innerText = `${baseRadares.length} radares activos`;
      log(`Listo: ${baseRadares.length} puntos en memoria.`);
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function coincideSentido(rumboMoto, rumboRadar) {
      if (rumboRadar === null || rumboRadar === undefined || isNaN(rumboMoto)) return true;
      let diff = Math.abs(rumboMoto - rumboRadar) % 360;
      if (diff > 180) diff = 360 - diff;
      return diff <= TOLERANCIA_RUMBO;
    }

    function mostrarAlertaVisual(radar, distancia) {
      const card = document.getElementById("radarAlertCard");
      document.getElementById("alertIcon").innerText = radar.icone || "📷";
      document.getElementById("alertSpeedSign").innerText = radar.velMax || "--";
      document.getElementById("alertTypeTitle").innerText = `RADAR ${radar.tipo.toUpperCase()}`;
      document.getElementById("alertDistance").innerText = `A ${Math.round(distancia)} METROS`;
      card.style.display = "block";
    }

    function ocultarAlertaVisual() {
      document.getElementById("radarAlertCard").style.display = "none";
    }

    // GESTIÓN DE AVISOS ESCALONADOS (300m -> 150m -> Fin)
    function gestionarVozEscalonada(radar, dist) {
      if (!avisosPorVoz[radar.id]) {
        avisosPorVoz[radar.id] = { fase300: false, fase150: false, faseFin: false };
      }

      const estado = avisosPorVoz[radar.id];

      if (dist <= 320 && dist > 180 && !estado.fase300) {
        estado.fase300 = true;
        log(`VOZ: ${radar.tipo.toUpperCase()} a 300m (${radar.velMax})`);
        locucion(`Atención, radar ${radar.tipo} a trescientos metros, límite ${radar.velMax}`);
      }
      else if (dist <= 170 && dist > 70 && !estado.fase150) {
        estado.fase150 = true;
        log(`VOZ: A 150 metros`);
        locucion(`A ciento cincuenta metros`);
      }
      else if (dist <= 45 && !estado.faseFin) {
        estado.faseFin = true;
        log(`VOZ: Superado`);
        locucion(`Punto de control`);
      }
    }

    function procesarGPS(pos) {
      document.getElementById("gpsStatus").innerText = "Activo";
      document.getElementById("gpsStatus").style.color = "#00e676";

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const vel = pos.coords.speed !== null ? Math.round(pos.coords.speed * 3.6) : 0;
      const rumbo = pos.coords.heading !== null && !isNaN(pos.coords.heading) ? Math.round(pos.coords.heading) : null;

      document.getElementById("speedDisplay").innerText = vel;
      document.getElementById("headingDisplay").innerText = rumbo !== null ? rumbo : "--";

      let radarActivo = null;
      let distanciaMinima = Infinity;

      baseRadares.forEach(radar => {
        const dist = calcularDistancia(lat, lon, radar.lat, radar.lon);
        const radioAviso = radar.distanciaAviso || 350;

        if (dist <= radioAviso) {
          if (coincideSentido(rumbo, radar.rumbo)) {
            if (dist < distanciaMinima) {
              distanciaMinima = dist;
              radarActivo = radar;
            }
            gestionarVozEscalonada(radar, dist);
          }
        } else if (dist > radioAviso * 1.6) {
          if (avisosPorVoz[radar.id]) delete avisosPorVoz[radar.id];
        }
      });

      if (radarActivo) {
        mostrarAlertaVisual(radarActivo, distanciaMinima);
      } else {
        ocultarAlertaVisual();
      }
    }

    function toggleSistema() {
      const btn = document.getElementById("mainBtn");

      if (watchId === null) {
        locucion("Sistema de radares activado.");
        if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});

        watchId = navigator.geolocation.watchPosition(
          procesarGPS,
          (err) => { log("Error GPS: " + err.message); },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );

        btn.innerText = "DETENER SISTEMA";
        btn.classList.add("active");
        log("Rastreo GPS en marcha.");
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        ocultarAlertaVisual();
        document.getElementById("gpsStatus").innerText = "Detenido";
        document.getElementById("gpsStatus").style.color = "#ff9100";
        document.getElementById("speedDisplay").innerText = "0";
        document.getElementById("headingDisplay").innerText = "--";
        btn.innerText = "ACTIVAR SISTEMA";
        btn.classList.remove("active");
        locucion("Sistema detenido.");
      }
    }

    window.addEventListener("DOMContentLoaded", sincronizarBaseRadares);
  </script>
</body>
</html>
