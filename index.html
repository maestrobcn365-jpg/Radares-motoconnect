<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Radar Moto BT - Aviso Completo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 16px;
    }
    header { text-align: center; margin-top: 5px; }
    h1 { font-size: 1.3rem; color: #ff3b30; letter-spacing: 1px; }

    /* TARJETA DE ALERTA DINÁMICA */
    .alert-card {
      display: none;
      width: 100%;
      max-width: 380px;
      background: #1f1212;
      border: 3px solid #ff3b30;
      border-radius: 18px;
      padding: 16px;
      margin: 10px 0;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 59, 48, 0.5);
      animation: pulsoAlerta 1.2s infinite alternate;
    }
    @keyframes pulsoAlerta {
      from { border-color: #ff3b30; transform: scale(1); }
      to { border-color: #ffffff; transform: scale(1.02); }
    }

    .alert-top {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 10px;
    }

    /* SEÑAL DE TRÁFICO REDONDA OFICIAL */
    .traffic-sign {
      width: 82px;
      height: 82px;
      background-color: #ffffff;
      border: 9px solid #d32f2f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .traffic-sign span {
      color: #000000;
      font-size: 2.1rem;
      font-weight: 900;
      font-family: Arial, Helvetica, sans-serif;
    }

    .radar-icon-box {
      font-size: 3.2rem;
    }

    .radar-info-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .radar-info-dist {
      font-size: 1.8rem;
      color: #00e676;
      font-weight: 800;
      margin-top: 4px;
    }

    /* PANEL PRINCIPAL */
    .panel {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 16px;
      text-align: center;
    }
    .metric-group {
      display: flex;
      justify-content: space-around;
      margin: 10px 0;
    }
    .metric {
      display: flex;
      flex-direction: column;
    }
    .metric .val {
      font-size: 2.4rem;
      font-weight: 700;
      color: #00e676;
    }
    .metric .lbl {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
    }
    .status-row {
      font-size: 0.8rem;
      color: #888;
      margin: 4px 0;
      display: flex;
      justify-content: space-between;
    }
    .log-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      height: 70px;
      padding: 8px;
      font-size: 0.75rem;
      color: #bbb;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
      margin-top: 8px;
    }

    .btn-action {
      background: #ff3b30;
      color: #fff;
      border: none;
      width: 100%;
      max-width: 380px;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-action.active {
      background: #333;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    <h1>RADAR MOTO BT</h1>
    <span style="font-size: 0.8rem; color: #888;">Audio BT: X10 / CAR-KIT</span>
  </header>

  <!-- PANEL DE AVISO VISUAL -->
  <div class="alert-card" id="radarAlertCard">
    <div class="alert-top">
      <div class="radar-icon-box" id="alertIcon">📷</div>
      <div class="traffic-sign">
        <span id="alertSpeedSign">50</span>
      </div>
    </div>
    <div class="radar-info-title" id="alertTypeTitle">RADAR FIJO</div>
    <div class="radar-info-dist" id="alertDistance">A 280 METROS</div>
  </div>

  <!-- PANEL DE VELOCIDAD Y ESTADO -->
  <div class="panel">
    <div class="metric-group">
      <div class="metric">
        <span class="val" id="speedDisplay">0</span>
        <span class="lbl">km/h</span>
      </div>
      <div class="metric">
        <span class="val" id="headingDisplay">--</span>
        <span class="lbl">Rumbo (°)</span>
      </div>
    </div>
    
    <div class="status-row">
      <span>Estado GPS:</span>
      <span id="gpsStatus" style="color: #ff9100;">En espera</span>
    </div>
    <div class="status-row">
      <span>Radares en memoria:</span>
      <span id="dbStatus" style="color: #00e676;">4 cargados</span>
    </div>

    <div class="log-box" id="logBox">> Pulsa Activar Sistema para iniciar...</div>
  </div>

  <button class="btn-action" id="mainBtn" onclick="toggleSistema()">ACTIVAR SISTEMA</button>

  <script>
    // BASE DE DATOS DE PUNTOS DE CONTROL
    const baseRadares = [
      { id: "BCN-SEM-01", tipo: "semáforo", icone: "🚦", velMax: 50, lat: 41.4421, lon: 2.2285, rumbo: 135, distanciaAviso: 220 },
      { id: "C31-FIJO-01", tipo: "fijo", icone: "📷", velMax: 80, lat: 41.4365, lon: 2.2351, rumbo: 45, distanciaAviso: 350 },
      { id: "B20-TRAMO-01", tipo: "tramo", icone: "⏱️", velMax: 80, lat: 41.4602, lon: 2.2210, rumbo: 210, distanciaAviso: 400 },
      { id: "A2-MOVIL-01", tipo: "móvil habitual", icone: "🚗", velMax: 100, lat: 41.5350, lon: 1.8480, rumbo: 265, distanciaAviso: 450 }
    ];

    let watchId = null;
    let wakeLock = null;
    // Registro de etapas de voz por cada radar para no repetir avisos
    const avisosPorVoz = {}; 
    const TOLERANCIA_RUMBO = 45;

    function log(msg) {
      const box = document.getElementById("logBox");
      box.innerHTML += `<br>> ${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    function locucion(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = 'es-ES';
        voz.rate = 1.1;
        window.speechSynthesis.speak(voz);
      }
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function coincideSentido(rumboMoto, rumboRadar) {
      if (rumboRadar === null || rumboRadar === undefined || isNaN(rumboMoto)) return true;
      let diff = Math.abs(rumboMoto - rumboRadar) % 360;
      if (diff > 180) diff = 360 - diff;
      return diff <= TOLERANCIA_RUMBO;
    }

    function mostrarAlertaVisual(radar, distancia) {
      const card = document.getElementById("radarAlertCard");
      document.getElementById("alertIcon").innerText = radar.icone || "📷";
      document.getElementById("alertSpeedSign").innerText = radar.velMax || "--";
      document.getElementById("alertTypeTitle").innerText = `RADAR ${radar.tipo.toUpperCase()}`;
      document.getElementById("alertDistance").innerText = `A ${Math.round(distancia)} METROS`;
      card.style.display = "block";
    }

    function ocultarAlertaVisual() {
      document.getElementById("radarAlertCard").style.display = "none";
    }

    // GESTOR DE AVISOS POR VOZ ESCALONADOS
    function gestionarVozEscalonada(radar, dist) {
      if (!avisosPorVoz[radar.id]) {
        avisosPorVoz[radar.id] = { fase300: false, fase150: false, faseFin: false };
      }

      const estado = avisosPorVoz[radar.id];

      // 1. Primer aviso: entrada al rango (aprox 300 metros)
      if (dist <= 320 && dist > 180 && !estado.fase300) {
        estado.fase300 = true;
        log(`VOZ: Radar ${radar.tipo} a 300m (Límite ${radar.velMax})`);
        locucion(`Atención, radar ${radar.tipo} a trescientos metros, límite ${radar.velMax}`);
      }
      // 2. Segundo aviso intermedio: confirmación de distancia
      else if (dist <= 170 && dist > 70 && !estado.fase150) {
        estado.fase150 = true;
        log(`VOZ: A 150 metros`);
        locucion(`A ciento cincuenta metros`);
      }
      // 3. Tercer aviso: radar superado o punto rebasado
      else if (dist <= 45 && !estado.faseFin) {
        estado.faseFin = true;
        log(`VOZ: Punto de control`);
        locucion(`Punto de control`);
      }
    }

    function procesarGPS(pos) {
      document.getElementById("gpsStatus").innerText = "Activo";
      document.getElementById("gpsStatus").style.color = "#00e676";

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const vel = pos.coords.speed !== null ? Math.round(pos.coords.speed * 3.6) : 0;
      const rumbo = pos.coords.heading !== null && !isNaN(pos.coords.heading) ? Math.round(pos.coords.heading) : null;

      document.getElementById("speedDisplay").innerText = vel;
      document.getElementById("headingDisplay").innerText = rumbo !== null ? rumbo : "--";

      let radarActivo = null;
      let distanciaMinima = Infinity;

      baseRadares.forEach(radar => {
        const dist = calcularDistancia(lat, lon, radar.lat, radar.lon);
        const radioAviso = radar.distanciaAviso || 300;

        if (dist <= radioAviso) {
          if (coincideSentido(rumbo, radar.rumbo)) {
            // Guardamos el radar más cercano para actualizar el panel visual
            if (dist < distanciaMinima) {
              distanciaMinima = dist;
              radarActivo = radar;
            }

            // Evaluar avisos escalonados por audio
            gestionarVozEscalonada(radar, dist);
          }
        } 
        // Si nos alejamos más allá del radio, reseteamos las etapas de voz
        else if (dist > radioAviso * 1.6) {
          if (avisosPorVoz[radar.id]) {
            delete avisosPorVoz[radar.id];
          }
        }
      });

      if (radarActivo) {
        mostrarAlertaVisual(radarActivo, distanciaMinima);
      } else {
        ocultarAlertaVisual();
      }
    }

    function toggleSistema() {
      const btn = document.getElementById("mainBtn");

      if (watchId === null) {
        locucion("Sistema de radares activado.");
        if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});

        watchId = navigator.geolocation.watchPosition(
          procesarGPS,
          (err) => { log("Error GPS: " + err.message); },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );

        btn.innerText = "DETENER SISTEMA";
        btn.classList.add("active");
        log("Rastreo GPS en marcha.");
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        ocultarAlertaVisual();
        document.getElementById("gpsStatus").innerText = "Detenido";
        document.getElementById("gpsStatus").style.color = "#ff9100";
        document.getElementById("speedDisplay").innerText = "0";
        document.getElementById("headingDisplay").innerText = "--";
        btn.innerText = "ACTIVAR SISTEMA";
        btn.classList.remove("active");
        locucion("Sistema detenido.");
      }
    }
  </script>
</body>
</html>
